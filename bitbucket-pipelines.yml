image: node:10.15.3

pipelines:
  branches:
    prod:
      - step:
          name: Build
          script:
            - pwd 
            - npm install
            - git archive --format=tar.gz $BITBUCKET_BRANCH -o $heroku_app_name.tar.gz
            - echo $heroku_app_name.tar.gz
          artifacts:
            - $heroku_app_name.tar.gz
          
      - step:
          name: Deploy to Production
          deployment: Production
          caches:
          - node
          script:
            - echo $heroku_app_name.tar.gz
            - pipe: atlassian/heroku-deploy:1.2.1
              variables:
                HEROKU_API_KEY: $heroku_api_key
                HEROKU_APP_NAME: $heroku_app_name
                ZIP_FILE: $heroku_app_name.tar.gz
       